examples:
  - question: What was monthly revenue in 2025?
    sql: |
      SELECT strftime('%Y-%m', o.order_date) AS month,
             SUM(o.total_amount) AS revenue
      FROM orders o
      JOIN customers c ON c.customer_id = o.customer_id
      WHERE o.status NOT IN ('cancelled', 'refunded')
        AND c.is_test = 0
        AND o.order_date >= '2025-01-01' AND o.order_date < '2026-01-01'
      GROUP BY 1
      ORDER BY 1;
  - question: What are the top 5 products by units sold?
    sql: |
      SELECT p.name, SUM(i.quantity) AS units
      FROM order_items i
      JOIN orders o ON o.order_id = i.order_id
      JOIN customers c ON c.customer_id = o.customer_id
      JOIN products p ON p.product_id = i.product_id
      WHERE o.status NOT IN ('cancelled', 'refunded') AND c.is_test = 0
      GROUP BY p.name
      ORDER BY units DESC
      LIMIT 5;
  - question: How many customers signed up per country?
    sql: |
      SELECT country, COUNT(*) AS customers
      FROM customers
      WHERE is_test = 0
      GROUP BY country
      ORDER BY customers DESC;
