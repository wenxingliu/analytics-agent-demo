table: order_items
description: >
  One row per product on an order. Use it to see what was bought and in what quantity.
grain: one row per (order_id, product_id)
primary_key: [order_id, product_id]
tags: [sales, products]

columns:
  - name: order_id
    type: INTEGER
    description: The order this line belongs to.
    foreign_key: orders.order_id
  - name: product_id
    type: INTEGER
    description: The product bought.
    foreign_key: products.product_id
  - name: quantity
    type: INTEGER
    description: Units bought.
  - name: unit_price
    type: DECIMAL(10,2)
    description: Price per unit in USD at the time of purchase, before tax.

relationships:
  - to_table: orders
    on: order_items.order_id = orders.order_id
  - to_table: products
    on: order_items.product_id = products.product_id
