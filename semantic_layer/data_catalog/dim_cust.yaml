table: dim_cust
description: >
  Customer master, one row per customer account. Includes internal test accounts, closed accounts
  and duplicate accounts that were merged into another one (see mrg_to_cust_id).
grain: one row per cust_id
primary_key: [cust_id]
tags: [customers, loyalty]

columns:
  - name: cust_id
    type: INTEGER
    description: Customer account id.
  - name: cust_nm
    type: VARCHAR
    description: >
      Customer full name, 'First Last'. Not unique: a merged duplicate account has the same name as the
      account it was merged into. Group and count customers by id, not by name. Test accounts are named
      'Test User <id>', but filter them with tst_acct_flg.
    pii: true
  - name: eml_addr
    type: VARCHAR
    description: >
      Email address, lower case. Differs between a merged duplicate and the account it was merged into,
      so it does not identify a person on its own.
    pii: true
  - name: ph_no
    type: VARCHAR
    description: Phone number; often NULL.
    pii: true
  - name: ctry_cd
    type: VARCHAR
    description: Country of residence (ISO 2-letter).
    allowed_values: [US, CA, GB]
  - name: st_prov_cd
    type: VARCHAR
    description: US state or Canadian province code. NULL for GB.
  - name: reg_ts
    type: TIMESTAMP
    description: Registration time, UTC, text 'YYYY-MM-DD HH:MM:SS'.
  - name: reg_chnl_cd
    type: VARCHAR
    description: Channel the customer registered through. WEB = website, APP = mobile app, STR = in store, REF = referral.
    allowed_values: [WEB, APP, STR, REF]
  - name: cust_tier_cd
    type: VARCHAR
    description: >
      Loyalty tier, recalculated nightly. This is the current tier only, not the tier at the time of an order.
      B = Bronze, S = Silver, G = Gold, P = Platinum.
    allowed_values: [B, S, G, P]
  - name: mktg_optin_flg
    type: VARCHAR
    description: Y if the customer agreed to marketing emails, otherwise N.
    allowed_values: [Y, N]
  - name: acct_sts_cd
    type: VARCHAR
    description: Account status. A = active, S = suspended, C = closed. Closed accounts keep their order history.
    allowed_values: [A, S, C]
  - name: tst_acct_flg
    type: VARCHAR
    description: Y for internal test accounts, otherwise N.
    allowed_values: ["Y", "N"]
  - name: mrg_to_cust_id
    type: INTEGER
    description: >
      If not NULL, this account is a duplicate that was merged into the account with this cust_id.
      The duplicate keeps its own email, phone, country and shipping address, which can differ from the surviving account's.
    foreign_key: dim_cust.cust_id
  - name: ref_cust_id
    type: INTEGER
    description: The customer who referred this one. Only set when reg_chnl_cd = 'REF'.
    foreign_key: dim_cust.cust_id
  - name: lst_login_ts
    type: TIMESTAMP
    description: Last login time, UTC. Logins are not orders; do not use this to define active customers.
  - name: shp_addr_ln1
    type: VARCHAR
    description: >
      Default shipping address, street line. This is the customer's current saved address, not the address
      a past order shipped to; use fct_ord_hdr.ship_ctry_cd for an order's destination country.
      All shp_* columns are NULL when the customer never saved an address.
    pii: true
  - name: shp_addr_ln2
    type: VARCHAR
    description: Default shipping address, second line (apartment, flat or suite); usually NULL.
    pii: true
  - name: shp_city_nm
    type: VARCHAR
    description: Default shipping address, city name.
  - name: shp_st_prov_cd
    type: VARCHAR
    description: Default shipping address, US state or Canadian province code. NULL for GB.
  - name: shp_pstl_cd
    type: VARCHAR
    description: Default shipping address, ZIP or postal code, stored as text.
    pii: true
  - name: shp_ctry_cd
    type: VARCHAR
    description: Default shipping address, country (ISO 2-letter).
    allowed_values: [US, CA, GB]

relationships:
  - to_table: fct_ord_hdr
    on: dim_cust.cust_id = fct_ord_hdr.cust_id
