table: products
description: One row per product in the catalog.
grain: one row per product_id
primary_key: [product_id]
tags: [products]

columns:
  - name: product_id
    type: INTEGER
    description: Unique product identifier.
  - name: name
    type: VARCHAR
    description: Product name.
  - name: category
    type: VARCHAR
    description: Product category.
    allowed_values: [Kitchen, Living Room, Decor, Bedroom, Bathroom, Storage]
  - name: price
    type: DECIMAL(10,2)
    description: Current list price in USD.
